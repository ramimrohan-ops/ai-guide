name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: unzip -q www.zip && unzip -q resources.zip
      - run: cp data.json www/data.json
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#111a24' --splashBackgroundColor '#f4f6f8' --splashBackgroundColorDark '#0d1218'
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: WhichAI-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
